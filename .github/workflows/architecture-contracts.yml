name: Architecture contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Gate 9 Linux runner isolation
        run: node scripts/setup-gate-9-linux-isolation.mjs
      - name: Install browser proofs
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Phase 0 through Gate 9
        run: pnpm gate:9
        env:
          K_NEX_RUNNER_ISOLATION_POLICY: apparmor
      - name: Verify exact-head repository evidence
        run: |
          pnpm audit --audit-level high
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
