name: Release evidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Build customer applications and evidence tooling
        run: pnpm --filter @k-nex/contracts build && pnpm --filter @k-nex/composition build && pnpm --filter @k-nex/runtime build && pnpm --dir fixtures/customer-alpha exec tsc -p tsconfig.json && pnpm --dir fixtures/customer-beta exec tsc -p tsconfig.json
      - name: Generate and build verified target applications
        run: |
          mkdir -p "${RUNNER_TEMP}/phase-8-targets"
          node scripts/create-knex-app.mjs --target "${RUNNER_TEMP}/phase-8-targets/customer-alpha" --id customer-alpha --name "Customer Alpha" --theme minimal --database external --release-manifest releases/0.2.1/package-release-manifest.json --package-mirror fixtures/customer-gate-1/packages
          node scripts/create-knex-app.mjs --target "${RUNNER_TEMP}/phase-8-targets/customer-beta" --id customer-beta --name "Customer Beta" --theme neobrutalism --database external --release-manifest releases/0.2.1/package-release-manifest.json --package-mirror fixtures/customer-gate-1/packages
          pnpm --dir "${RUNNER_TEMP}/phase-8-targets/customer-alpha" build
          pnpm --dir "${RUNNER_TEMP}/phase-8-targets/customer-beta" build
      - name: Generate customer-specific deployable bundles and predicates
        run: |
          node scripts/generate-release-evidence.mjs \
            --source-sha "${GITHUB_SHA}" \
            --workflow-identity "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml@${GITHUB_SHA}" \
            --output release-evidence \
            --customer customer-alpha
          node scripts/generate-release-evidence.mjs \
            --source-sha "${GITHUB_SHA}" \
            --workflow-identity "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml@${GITHUB_SHA}" \
            --output release-evidence/customer-beta \
            --customer customer-beta
          node scripts/generate-release-evidence.mjs \
            --source-sha "${GITHUB_SHA}" \
            --workflow-identity "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml@${GITHUB_SHA}" \
            --application-root "${RUNNER_TEMP}/phase-8-targets/customer-alpha" \
            --release 0.2.1 --migration-revision 8 \
            --output release-evidence/targets/customer-alpha \
            --customer customer-alpha
          node scripts/generate-release-evidence.mjs \
            --source-sha "${GITHUB_SHA}" \
            --workflow-identity "${GITHUB_REPOSITORY}/.github/workflows/release-evidence.yml@${GITHUB_SHA}" \
            --application-root "${RUNNER_TEMP}/phase-8-targets/customer-beta" \
            --release 0.2.1 --migration-revision 8 \
            --output release-evidence/targets/customer-beta \
            --customer customer-beta
      - name: Attest Customer Alpha deployable application bundle with GitHub OIDC
        id: provenance-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-evidence/customer-alpha.application-bundle.json
          predicate-type: https://k-nex.dev/provenance/v1
          predicate-path: release-evidence/provenance-predicate.json
      - name: Attest Customer Beta deployable application bundle with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-evidence/customer-beta/customer-beta.application-bundle.json
          predicate-type: https://k-nex.dev/provenance/v1
          predicate-path: release-evidence/customer-beta/provenance-predicate.json
      - name: Attest current package release manifest with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-evidence/release-manifest.json
          predicate-type: https://k-nex.dev/release-manifest/v1
          predicate-path: release-evidence/release-manifest-predicate.json
      - name: Attest prior package release manifest with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-evidence/customer-beta/release-manifest.json
          predicate-type: https://k-nex.dev/release-manifest/v1
          predicate-path: release-evidence/customer-beta/release-manifest-predicate.json
      - name: Attest Customer Alpha target application bundle with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-evidence/targets/customer-alpha/customer-alpha.application-bundle.json
          predicate-type: https://k-nex.dev/provenance/v1
          predicate-path: release-evidence/targets/customer-alpha/provenance-predicate.json
      - name: Attest Customer Beta target application bundle with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-evidence/targets/customer-beta/customer-beta.application-bundle.json
          predicate-type: https://k-nex.dev/provenance/v1
          predicate-path: release-evidence/targets/customer-beta/provenance-predicate.json
      - name: Attest target package release manifest with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-evidence/targets/customer-alpha/release-manifest.json
          predicate-type: https://k-nex.dev/release-manifest/v1
          predicate-path: release-evidence/targets/customer-alpha/release-manifest-predicate.json
      - name: Download and verify hosted bundles against exact subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-evidence/hosted/application release-evidence/hosted/manifest release-evidence/customer-beta/hosted/application release-evidence/customer-beta/hosted/manifest
          mkdir -p release-evidence/targets/customer-alpha/hosted/application release-evidence/targets/customer-alpha/hosted/manifest release-evidence/targets/customer-beta/hosted/application
          (cd release-evidence/hosted/application && gh attestation download ../../customer-alpha.application-bundle.json --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/provenance/v1)
          (cd release-evidence/hosted/manifest && gh attestation download ../../release-manifest.json --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/release-manifest/v1)
          (cd release-evidence/customer-beta/hosted/application && gh attestation download ../../customer-beta.application-bundle.json --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/provenance/v1)
          (cd release-evidence/customer-beta/hosted/manifest && gh attestation download ../../release-manifest.json --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/release-manifest/v1)
          (cd release-evidence/targets/customer-alpha/hosted/application && gh attestation download ../../customer-alpha.application-bundle.json --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/provenance/v1)
          (cd release-evidence/targets/customer-beta/hosted/application && gh attestation download ../../customer-beta.application-bundle.json --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/provenance/v1)
          (cd release-evidence/targets/customer-alpha/hosted/manifest && gh attestation download ../../release-manifest.json --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/release-manifest/v1)
          APP_BUNDLE="$(find release-evidence/hosted/application -type f | head -1)"
          MANIFEST_BUNDLE="$(find release-evidence/hosted/manifest -type f | head -1)"
          BETA_APP_BUNDLE="$(find release-evidence/customer-beta/hosted/application -type f | head -1)"
          BETA_MANIFEST_BUNDLE="$(find release-evidence/customer-beta/hosted/manifest -type f | head -1)"
          TARGET_ALPHA_APP_BUNDLE="$(find release-evidence/targets/customer-alpha/hosted/application -type f | head -1)"
          TARGET_BETA_APP_BUNDLE="$(find release-evidence/targets/customer-beta/hosted/application -type f | head -1)"
          TARGET_MANIFEST_BUNDLE="$(find release-evidence/targets/customer-alpha/hosted/manifest -type f | head -1)"
          gh attestation verify release-evidence/customer-alpha.application-bundle.json --bundle "${APP_BUNDLE}" --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/provenance/v1 --format json > release-evidence/hosted/application-verification.json
          gh attestation verify release-evidence/release-manifest.json --bundle "${MANIFEST_BUNDLE}" --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/release-manifest/v1 --format json > release-evidence/hosted/manifest-verification.json
          gh attestation verify release-evidence/customer-beta/customer-beta.application-bundle.json --bundle "${BETA_APP_BUNDLE}" --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/provenance/v1 --format json > release-evidence/customer-beta/hosted/application-verification.json
          gh attestation verify release-evidence/customer-beta/release-manifest.json --bundle "${BETA_MANIFEST_BUNDLE}" --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/release-manifest/v1 --format json > release-evidence/customer-beta/hosted/manifest-verification.json
          gh attestation verify release-evidence/targets/customer-alpha/customer-alpha.application-bundle.json --bundle "${TARGET_ALPHA_APP_BUNDLE}" --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/provenance/v1 --format json > release-evidence/targets/customer-alpha/hosted/application-verification.json
          gh attestation verify release-evidence/targets/customer-beta/customer-beta.application-bundle.json --bundle "${TARGET_BETA_APP_BUNDLE}" --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/provenance/v1 --format json > release-evidence/targets/customer-beta/hosted/application-verification.json
          gh attestation verify release-evidence/targets/customer-alpha/release-manifest.json --bundle "${TARGET_MANIFEST_BUNDLE}" --repo "${GITHUB_REPOSITORY}" --predicate-type https://k-nex.dev/release-manifest/v1 --format json > release-evidence/targets/customer-alpha/hosted/manifest-verification.json
          mv "${APP_BUNDLE}" release-evidence/hosted/application/application-attestation.jsonl
          mv "${MANIFEST_BUNDLE}" release-evidence/hosted/manifest/manifest-attestation.jsonl
          mv "${BETA_APP_BUNDLE}" release-evidence/customer-beta/hosted/application/application-attestation.jsonl
          mv "${BETA_MANIFEST_BUNDLE}" release-evidence/customer-beta/hosted/manifest/manifest-attestation.jsonl
          mv "${TARGET_ALPHA_APP_BUNDLE}" release-evidence/targets/customer-alpha/hosted/application/application-attestation.jsonl
          mv "${TARGET_BETA_APP_BUNDLE}" release-evidence/targets/customer-beta/hosted/application/application-attestation.jsonl
          mv "${TARGET_MANIFEST_BUNDLE}" release-evidence/targets/customer-alpha/hosted/manifest/manifest-attestation.jsonl
      - name: Attest artifact SBOM with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-evidence/customer-alpha.application-bundle.json
          sbom-path: release-evidence/sbom.cdx.json
      - name: Publish hosted verification evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: phase-8-hosted-release-evidence
          path: |
            release-evidence/customer-alpha.application-bundle.json
            release-evidence/hosted
            release-evidence/customer-beta
            release-evidence/targets
            release-evidence/provenance-predicate.json
            release-evidence/provenance.json
            release-evidence/release-manifest-predicate.json
            release-evidence/release-manifest.json
            release-evidence/sbom.cdx.json
          if-no-files-found: error
